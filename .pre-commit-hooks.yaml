# Hooks for pre-commit and prek: every check tool's hooks, from one repository. List the ids you use under one
# `repo: https://github.com/kilotronic/checks` entry. Each tool's hooks sit under its own `# === <tool>` heading;
# an id never changes and never repeats across tools.

# === lint
# Hooks for pre-commit and prek.
#
# shellcheck, actionlint, pinned, workflow-safety, non-root and zizmor run the Action's own lint/src/lint.sh step on the
# repository's tracked files, with the same pinned, checksum-checked shellcheck, actionlint and zizmor (cached
# under ~/.cache).
#
# The rest are the format and lint bundle (format-all and lint-all): formatters first, then linters, each at a
# pinned version. A repository's own configuration file (ruff.toml, .prettierrc, .editorconfig, taplo.toml,
# .markdownlint*, .yamllint) is used when it has one; otherwise the bundle's defaults. CSV files are linted,
# never rewritten.
#
# The bundle's own skips (lockfiles, CSV, JSON with comments) live in `files:` as a negative lookahead, not in
# `exclude:`, so a repository that sets its own `exclude:` on a hook adds to them instead of replacing them.
- id: shellcheck
  name: shellcheck (shell scripts)
  description: shellcheck every tracked shell script (*.sh, *.bash, or a sh/bash shebang).
  entry: lint/src/lint.sh hook shellcheck
  language: script
  pass_filenames: false
  types: [shell]
  stages: [pre-commit, pre-merge-commit, manual]
- id: actionlint
  name: actionlint (workflows)
  description: actionlint every workflow in .github/workflows, with their run scripts through shellcheck.
  entry: lint/src/lint.sh hook actionlint
  language: script
  pass_filenames: false
  files: ^\.github/(workflows/.*\.ya?ml|actionlint\.ya?ml)$
  stages: [pre-commit, pre-merge-commit, manual]
- id: pinned
  name: pinned (actions and pre-commit hooks by commit SHA, base images by digest, no piped downloads)
  description: >-
    Every action is pinned to a commit SHA, every Docker base image to a digest, every pre-commit rev to a commit
    SHA with a "# frozen: <tag>" comment, and no download is piped into a shell.
  entry: lint/src/lint.sh hook pinned
  language: script
  pass_filenames: false
  files: (^\.github/workflows/.*\.ya?ml$|(^|/)action\.ya?ml$|Dockerfile|(^|/)\.pre-commit-config\.ya?ml$|\.(sh|bash|mk)$|(^|/)(GNU)?[Mm]akefile$)
  stages: [pre-commit, pre-merge-commit, manual]
- id: workflow-safety
  name: workflow-safety (permissions, secrets, runners, inputs)
  description: >-
    Read-only top-level permissions; no pull request code beside secrets; no secret or event text in run:
    scripts; GitHub's runners for a public repository's pull requests; no skip or force inputs.
  entry: lint/src/lint.sh hook workflow-safety
  language: script
  pass_filenames: false
  files: (^\.github/workflows/.*\.ya?ml$|(^|/)action\.ya?ml$)
  stages: [pre-commit, pre-merge-commit, manual]
- id: non-root
  name: non-root (containers run as a non-root user)
  description: Every Dockerfile's final stage runs as a user other than root (args [--skip=non-root] skips it).
  entry: lint/src/lint.sh hook non-root
  language: script
  pass_filenames: false
  files: Dockerfile
  stages: [pre-commit, pre-merge-commit, manual]
- id: zizmor
  name: zizmor (report-only GitHub Actions security audits)
  description: >-
    zizmor's audits on every workflow and action, offline, minus the ones pinned and workflow-safety already make
    (lint/src/zizmor.yml). Report-only: it prints what it finds and never fails the commit.
  entry: lint/src/lint.sh hook zizmor
  language: script
  pass_filenames: false
  files: (^\.github/workflows/.*\.ya?ml$|(^|/)action\.ya?ml$)
  verbose: true
  stages: [pre-commit, pre-merge-commit, manual]

# --- format-all: formatters (they rewrite files; run them before the linters)
- id: ruff-format
  name: ruff format (Python)
  entry: ruff format --force-exclude
  language: python
  additional_dependencies: [ruff==0.17.4]
  types_or: [python, pyi, jupyter]
  require_serial: true
- id: prettier
  name: prettier (JS, TS, CSS, Markdown, JSON, YAML)
  entry: prettier --write --ignore-unknown --no-error-on-unmatched-pattern --log-level=warn
  language: node
  additional_dependencies: [prettier@3.9.10]
  types_or: [javascript, jsx, ts, tsx, css, scss, less, markdown, json, yaml]
  files: ^(?!(.*/)?(package-lock\.json|npm-shrinkwrap\.json|pnpm-lock\.yaml|yarn\.lock)$)
  require_serial: true
- id: shfmt
  name: shfmt (shell scripts)
  entry: kilotronic-shfmt
  language: python
  additional_dependencies: [shfmt-py==4.2.0]
  types: [shell]
  exclude_types: [zsh]
- id: taplo-format
  name: taplo format (TOML)
  entry: taplo format
  language: python
  additional_dependencies: [taplo==0.9.3]
  types: [toml]

# --- lint-all: linters
- id: ruff-check
  name: ruff check (Python)
  entry: ruff check --fix --exit-non-zero-on-fix --force-exclude
  language: python
  additional_dependencies: [ruff==0.17.4]
  types_or: [python, pyi, jupyter]
  require_serial: true
- id: markdownlint
  name: markdownlint (Markdown)
  entry: kilotronic-markdownlint
  language: node
  additional_dependencies: [markdownlint-cli2@0.24.0]
  types: [markdown]
- id: yamllint
  name: yamllint (YAML)
  entry: kilotronic-yamllint
  language: python
  additional_dependencies: [yamllint==1.38.0]
  types: [yaml]
- id: us-english
  name: us-english (British spellings in prose rewritten to American)
  description: codespell's British-to-American list only, on Markdown, plain text and reStructuredText; code files, code spans and blocks, and link targets are left alone. A repository's own codespell config (.codespellrc, setup.cfg or pyproject's [tool.codespell]) adds words to ignore.
  entry: kilotronic-us-english
  language: python
  additional_dependencies: ["codespell[toml]==2.4.3"]
  files: (?i)\.(md|markdown|txt|rst)$
  # Plain-text files that are data or copied text, not prose: dependency lists, CMake, license and notice texts.
  exclude: (?i)(^|/)(requirements[^/]*|constraints[^/]*|CMakeLists|(UN)?LICEN[CS]E[^/]*|COPYING[^/]*|NOTICE[^/]*|AUTHORS[^/]*)\.txt$
- id: us-english-commit-msg
  name: us-english (no British spellings in the commit message)
  description: The same check on the commit message; it reports and leaves the message as written.
  entry: kilotronic-us-english-commit-msg
  language: python
  additional_dependencies: ["codespell[toml]==2.4.3"]
  stages: [commit-msg]
- id: csv-lint
  name: csv-lint (UTF-8, same columns in every row, a final newline; never rewritten)
  entry: kilotronic-csv-lint
  language: python
  files: (?i)\.(csv|tsv)$
- id: check-json
  name: check-json (valid JSON)
  entry: check-json
  language: python
  additional_dependencies: [pre-commit-hooks==6.0.0]
  types: [json]
  # JSON with comments, read by tools that allow them (prettier still parses these, so broken syntax still fails)
  files: ^(?!((.*/)?(tsconfig[^/]*|jsconfig[^/]*|appsettings[^/]*|\.devcontainer/[^/]*|\.vscode/[^/]*)\.json|.*\.jsonc)$)
- id: check-yaml
  name: check-yaml (valid YAML)
  entry: check-yaml --allow-multiple-documents
  language: python
  additional_dependencies: [pre-commit-hooks==6.0.0]
  types: [yaml]
- id: check-toml
  name: check-toml (valid TOML)
  entry: check-toml
  language: python
  additional_dependencies: [pre-commit-hooks==6.0.0]
  types: [toml]
- id: end-of-file-fixer
  name: end-of-file-fixer (one newline at the end)
  entry: end-of-file-fixer
  language: python
  additional_dependencies: [pre-commit-hooks==6.0.0]
  types: [text]
  files: (?i)^(?!.*\.(csv|tsv)$)
- id: trailing-whitespace
  name: trailing-whitespace
  entry: trailing-whitespace-fixer --markdown-linebreak-ext=md
  language: python
  additional_dependencies: [pre-commit-hooks==6.0.0]
  types: [text]
  files: (?i)^(?!.*\.(csv|tsv)$)
- id: mixed-line-ending
  name: mixed-line-ending (one line ending in each file)
  # A file mixing LF and CRLF gets the ending most of its lines use; a file that is all CRLF (a .bat, a VBA
  # module, a .sln) is left as it is.
  entry: mixed-line-ending --fix=auto
  language: python
  additional_dependencies: [pre-commit-hooks==6.0.0]
  types: [text]
  files: (?i)^(?!.*\.(csv|tsv)$)
- id: check-merge-conflict
  name: check-merge-conflict (no conflict markers)
  entry: check-merge-conflict --assume-in-merge
  language: python
  additional_dependencies: [pre-commit-hooks==6.0.0]
  types: [text]

# === git-identity
- id: git-identity
  name: Real git author identity
  description: Refuse placeholder and machine-default git identities, and optionally emails outside a list of domains (--domain=a.com,b.com).
  entry: check-git-identity
  language: python
  always_run: true
  pass_filenames: false
  stages: [pre-commit, pre-merge-commit, manual]
- id: commit-subject
  name: "Commit subject reads <type>: <imperative summary>"
  description: >-
    The subject is `<type>: <imperative summary>` with a type from --types (default feat, fix, refactor, perf, test,
    docs, build, ci, chore, style, revert); --require-body also wants a paragraph saying why. Opt-in: list the hook to use it.
  entry: check-commit-subject
  language: python
  stages: [commit-msg]
- id: session-trailer
  name: No Claude-Session trailer in a public repository
  description: >-
    Refuse a commit message with a Claude-Session line when the repository is public (asked of gh once a day and
    cached in the clone); a private repository, or an unknown visibility (offline), passes.
  entry: check-session-trailer
  language: python
  stages: [commit-msg]

# === secret-scan
# Hooks for pre-commit and prek. They run the same secret-scan/src/scan.sh and the same pinned, checksum-checked
# gitleaks as the Action, cached under ~/.cache/kilotronic-secret-scan. A .gitleaks.toml at the root of
# your repository is used. trufflehog is Action-only: it needs Docker and calls each key's service.
- id: secret-scan
  name: secret-scan (gitleaks, staged changes)
  description: Refuse a commit whose staged changes contain anything shaped like a secret.
  entry: secret-scan/src/scan.sh staged
  language: script
  pass_filenames: false
  stages: [pre-commit, pre-merge-commit, manual]
- id: secret-scan-push
  name: secret-scan (gitleaks, commits being pushed)
  description: Refuse a push whose new commits contain anything shaped like a secret.
  entry: secret-scan/src/scan.sh push
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-push]

# === data-leak-check
# Three hooks, one per git stage. Install the stages you use, e.g. `prek install -t pre-commit -t commit-msg
# -t pre-push`, or set `default_install_hook_types` in your config. The denylist comes from outside the
# repository: --denylist-file, $DATA_LEAK_DENYLIST, $DATA_LEAK_DENYLIST_FILE or ~/.config/data-leak-check/denylist.
- id: data-leak-check
  name: No private data in the staged changes
  description: Refuse denylisted terms in staged added lines, new file paths, and the commit's author and committer.
  entry: data-leak-check --staged
  language: python
  stages: [pre-commit]
  always_run: true
  pass_filenames: false
- id: data-leak-check-commit-msg
  name: No private data in the commit message
  description: Refuse denylisted terms in the commit message.
  entry: data-leak-check --commit-msg
  language: python
  stages: [commit-msg]
  always_run: true
- id: data-leak-check-pre-push
  name: No private data in the commits being pushed
  description: Refuse denylisted terms in the pushed commits' added lines, paths, messages, authors and committers.
  entry: data-leak-check --pre-push
  language: python
  stages: [pre-push]
  always_run: true
  pass_filenames: false

# === vendored-license-check
- id: vendored-license-check
  name: Vendored asset license compliance
  description: Enforce that every vendored asset file is declared with an allow-listed SPDX license.
  entry: vendored-license-check
  language: python
  pass_filenames: false
  stages: [pre-commit, pre-merge-commit, manual]
  # The gate walks the configured roots itself, so it does not consume the
  # changed-file list. Scope *when* it runs by setting `files:` in your own
  # .pre-commit-config.yaml, e.g.:
  #   files: '^(vendor/.*|assets/fonts/.*|vendored-assets\.toml)$'
