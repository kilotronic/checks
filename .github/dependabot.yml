version: 2
# Subjects read `build(deps): bump …`, the `<type>: <summary>` form the commit-subject check wants.
updates:
  # The workflows, and the composite Actions that use other actions.
  - package-ecosystem: github-actions
    directories: ["/", "/secret-scan", "/vendored-license-check"]
    schedule:
      interval: weekly
    commit-message: { prefix: "build", include: "scope" }
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message: { prefix: "build", include: "scope" }
    groups:
      pre-commit-hooks:
        patterns: ["*"]
  - package-ecosystem: uv
    directories: ["/git-identity", "/lint", "/red-on-logic"]
    schedule:
      interval: weekly
    commit-message: { prefix: "build", include: "scope" }
    groups:
      dev-tools:
        patterns: ["*"]
  - package-ecosystem: pip
    directories: ["/data-leak-check", "/vendored-license-check"]
    schedule:
      interval: weekly
    commit-message: { prefix: "build", include: "scope" }
  - package-ecosystem: npm
    directory: /red-on-logic/tests/js
    schedule:
      interval: weekly
    commit-message: { prefix: "build", include: "scope" }
    groups:
      test-runners:
        patterns: ["*"]
